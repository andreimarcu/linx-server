{% extends "base.html" %}

{% block title %}{{sitename}} - 404 Not Found{% endblock %}

{% block content %}
<div class="error-404">
  <a href="{{ sitepath }}"><img src='{{ sitepath }}static/images/404.jpg'></a>
  {% if expired and expiredmessage %}
  <p class="expired-message">{{ expiredmessage }}</p>
  {% endif %}
</div>
{% endblock %}
